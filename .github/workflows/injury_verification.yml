name: Injury Data Verification

on:
  schedule:
    # Optimized for game day injury reports (aligned with official NBA 15-min rolling updates)
    # Run at 11 AM EST (16:00 UTC), 12 PM EST (17:00 UTC), 5 PM EST (22:00 UTC), 7 PM EST (00:00 UTC next day)
    # Morning report → Early afternoon → Pre-primetime → Final check before main slate
    - cron: '0 16,17,22 * * *'  # 11 AM, 12 PM, 5 PM EST
    - cron: '0 0 * * *'          # 7 PM EST (00:00 UTC next day)
  workflow_dispatch:  # Allow manual triggering

jobs:
  verify-injuries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Injury Verification
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          python injury_verification.py > injury_report_$(date +%Y%m%d_%H%M).txt 2>&1
          cat injury_report_*.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: injury-report-${{ github.run_number }}
          path: injury_report_*.txt

      - name: Send Notification (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          REPORT=$(cat injury_report_*.txt | head -50)
          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🏥 Injury Verification Report\n\`\`\`$REPORT\`\`\`\"}"
