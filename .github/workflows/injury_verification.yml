name: Injury Data Verification

on:
  schedule:
    # Every 2h: 11 AM, 1 PM, 3 PM, 5 PM EST (16,18,20,22 UTC)
    - cron: '0 16,18,20,22 * * *'
    # Every 20 min: 6:25 PM, 6:45 PM EST (23:25, 23:45 UTC)
    - cron: '25,45 23 * * *'
    # Every 20 min: 7:05 PM – 10:45 PM EST (00:05–03:45 UTC next day)
    - cron: '5,25,45 0,1,2,3 * * *'
  workflow_dispatch:

jobs:
  verify-injuries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Injury Verification
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: |
          python injury_verification.py > injury_report_$(date +%Y%m%d_%H%M).txt 2>&1
          cat injury_report_*.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: injury-report-${{ github.run_number }}
          path: injury_report_*.txt

      - name: Send Notification (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          REPORT=$(cat injury_report_*.txt | head -50)
          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🏥 Injury Verification Report\n\`\`\`$REPORT\`\`\`\"}"
